name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff)
        run: ruff check src/ api/ scripts/ tests/

      - name: Point MLflow artifact paths at this runner
        # mlflow.db stores artifact paths from the machine that trained the model
        # (Windows). Rewrite them to this checkout, the same step the Dockerfile does.
        run: python scripts/rewrite_artifact_paths.py mlflow.db "file://${GITHUB_WORKSPACE}/mlruns"

      - name: Run unit tests
        run: pytest tests/ -v

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t fraud-detector-api:ci .
